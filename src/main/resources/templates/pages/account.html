<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/sidebar}">

<head>
    <meta charset="UTF-8">
    <title>Money Tracker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- favicon -->
    <link rel="icon" th:href="@{/assets/images/logo/logo-sm.png}" sizes="16x16">

    <!-- bootstrap -->
    <link rel="stylesheet" th:href="@{/lib/bootstrap_5/bootstrap.min.css}">

    <!-- font awesome -->
    <link rel="stylesheet" th:href="@{/lib/fontawesome/css/all.min.css}">

    <!-- main css -->
    <link rel="stylesheet" th:href="@{/assets/css/global.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <link rel="stylesheet" th:href="@{/assets/css/responsive.css}">
</head>

<body>

    <!-- ================= CONTENT ================= -->
    <div layout:fragment="content">

        <!-- Title -->
        <h4 class="mb-4 text-capitalize">Tài khoản</h4>

        <!-- Add account -->
        <button type="button" class="btn btn-primary mb-4" id="addAccountBtn">
            <i class="fas fa-plus"></i> Thêm tài khoản
        </button>

        <div class="row">
            <div class="col-12">
                <div class="card d2c_projects_datatable">

                    <div class="card-header">
                        <h6>Danh sách tài khoản của bạn</h6>
                    </div>

                    <div class="card-body">

                        <!-- ===== EMPTY STATE ===== -->
                        <div th:if="${#maps.isEmpty(accountsByType)}" class="text-center text-muted py-5">
                            <i class="fas fa-wallet fa-3x mb-3"></i>
                            <p class="mb-3">Bạn chưa có tài khoản nào</p>
                            <button type="button" class="btn btn-primary" id="addAccountEmptyBtn">
                                <i class="fas fa-plus"></i> Thêm tài khoản đầu tiên
                            </button>
                        </div>

                        <!-- ===== ACCOUNT LIST ===== -->
                        <div th:if="${!#maps.isEmpty(accountsByType)}">

                            <div class="accordion" id="accountAccordion">

                                <div th:each="entry, iter : ${accountsByType}" class="accordion-item">

                                    <!-- Header -->
                                    <h2 class="accordion-header" th:id="'heading-' + ${iter.index}">
                                        <button class="accordion-button collapsed" type="button"
                                            data-bs-toggle="collapse" th:data-bs-target="'#collapse-' + ${iter.index}">

                                            <i class="fas fa-wallet me-2"></i>
                                            <span th:text="${entry.key}"></span>

                                            <span class="ms-auto text-muted"
                                                th:text="${#lists.size(entry.value)} + ' accounts'">
                                            </span>
                                        </button>
                                    </h2>

                                    <!-- Body -->
                                    <div th:id="'collapse-' + ${iter.index}" class="accordion-collapse collapse"
                                        data-bs-parent="#accountAccordion">

                                        <div class="accordion-body p-0">
                                            <table class="table table-hover align-middle mb-0">
                                                <thead class="table-light">
                                                    <tr>
                                                        <th class="ps-3">Tên tài khoản</th>
                                                        <th class="text-end">Số dư hiện tại</th>
                                                        <th class="text-center" style="width: 120px;">Hành động</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr th:each="acc : ${entry.value}">
                                                        <td class="ps-3">
                                                            <div class="d-flex align-items-center">
                                                                <div class="avatar-sm me-2 bg-light text-primary rounded-circle d-flex align-items-center justify-content-center"
                                                                    style="width: 32px; height: 32px;">
                                                                    <i class="fas fa-wallet small"></i>
                                                                </div>
                                                                <div>
                                                                    <span 
                                                                        th:text="${acc.accountName}"></span>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td class="text-end fw-semibold text-primary"
                                                            th:text="${#numbers.formatDecimal(acc.currentBalance, 0, 'COMMA', 0, 'POINT')} + ' ' + ${acc.currency}">
                                                        </td>
                                                        <td class="text-center">
                                                            <button
                                                                class="btn btn-sm btn-outline-primary me-1 edit-account-btn"
                                                                th:data-id="${acc.accountId}"
                                                                th:data-name="${acc.accountName}"
                                                                th:data-type="${acc.accountType}"
                                                                th:data-currency="${acc.currency}"
                                                                th:data-balance="${acc.currentBalance}" title="Sửa">
                                                                <i class="fas fa-edit"></i>
                                                            </button>
                                                            <button
                                                                class="btn btn-sm btn-outline-danger delete-account-btn"
                                                                th:data-id="${acc.accountId}"
                                                                th:data-name="${acc.accountName}" title="Xóa">
                                                                <i class="fas fa-trash-alt"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>

                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Account Modal -->
        <div class="modal fade" id="accountModal" tabindex="-1" aria-labelledby="accountModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="accountModalLabel">Thêm tài khoản mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="alert alert-danger d-none" id="modalErrorAlert"></div>
                        <form id="accountForm">
                            <input type="hidden" id="accountId">

                            <div class="mb-3">
                                <label for="accountName" class="form-label">Tên tài khoản <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="accountName"
                                    placeholder="Ví dụ: Ví cá nhân, Techcombank..." required>
                            </div>

                            <div class="mb-3">
                                <label for="accountType" class="form-label">Loại tài khoản <span
                                        class="text-danger">*</span></label>
                                <select class="form-select form-control" id="accountType" required>
                                    <option value="" disabled selected>Chọn loại tài khoản</option>
                                    <option value="CASH">Tiền mặt (CASH)</option>
                                    <option value="BANK">Tài khoản ngân hàng (BANK)</option>
                                    <option value="DEBIT">Thẻ ghi nợ (DEBIT)</option>
                                    <option value="CREDIT">Thẻ tín dụng (CREDIT)</option>
                                    <option value="EWALLET">Ví điện tử (EWALLET)</option>
                                    <option value="SAVINGS">Tài khoản tiết kiệm (SAVINGS)</option>
                                    <option value="INVESTMENT">Tài khoản đầu tư (INVESTMENT)</option>
                                    <option value="LOAN">Khoản vay (LOAN)</option>
                                </select>
                            </div>

                            <div class="mb-3" id="initialBalanceContainer">
                                <label for="initialBalance" class="form-label">Số dư ban đầu <span
                                        class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="initialBalance"
                                    placeholder="Nhập số dư ban đầu..." min="0" step="any" required>
                            </div>

                            <div class="mb-3" id="currencyContainer">
                                <label for="currency" class="form-label">Đơn vị tiền tệ <span
                                        class="text-danger">*</span></label>
                                <select class="form-select form-control" id="currency" required>
                                    <option value="VND" selected>VND</option>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" id="saveAccountBtn">Lưu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteConfirmModalLabel">Xác nhận xóa tài khoản</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Bạn có chắc chắn muốn xóa tài khoản <strong id="deleteAccountName" class="text-danger"></strong>
                        không? Hành động này không thể hoàn tác và sẽ xóa tất cả giao dịch liên quan!
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Xóa</button>
                    </div>
                </div>
            </div>
        </div>


        <script>
            document.addEventListener("DOMContentLoaded", function () {
                $(document).ready(function () {
                    let mode = 'CREATE'; // 'CREATE' or 'EDIT'
                    const accountModal = new bootstrap.Modal(document.getElementById('accountModal'));
                    const deleteConfirmModal = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));
                    let accountIdToDelete = null;

                    function showError(msg) {
                        if (msg) {
                            $('#modalErrorAlert').text(msg).removeClass('d-none');
                        } else {
                            $('#modalErrorAlert').addClass('d-none').text('');
                        }
                    }

                    // Open Modal for Add
                    $('#addAccountBtn, #addAccountEmptyBtn').on('click', function () {
                        mode = 'CREATE';
                        showError('');
                        $('#accountModalLabel').text('Thêm tài khoản mới');
                        $('#accountId').val('');
                        $('#accountName').val('');
                        $('#accountType').val('');
                        $('#initialBalance').val('0');
                        $('#currency').val('VND');

                        $('#initialBalanceContainer').removeClass('d-none');
                        $('#initialBalance').prop('required', true).prop('disabled', false);
                        $('#currencyContainer').removeClass('d-none');
                        $('#currency').prop('required', true).prop('disabled', false);

                        accountModal.show();
                    });

                    // Open Modal for Edit
                    $(document).on('click', '.edit-account-btn', function () {
                        mode = 'EDIT';
                        showError('');
                        $('#accountModalLabel').text('Sửa thông tin tài khoản');

                        const id = $(this).data('id');
                        const name = $(this).data('name');
                        const type = $(this).data('type');

                        $('#accountId').val(id);
                        $('#accountName').val(name);
                        $('#accountType').val(type);

                        // Hide initial balance and currency because they are not updatable via UpdateAccountRequest
                        $('#initialBalanceContainer').addClass('d-none');
                        $('#initialBalance').prop('required', false).prop('disabled', true);
                        $('#currencyContainer').addClass('d-none');
                        $('#currency').prop('required', false).prop('disabled', true);

                        accountModal.show();
                    });

                    // Save Account (Create or Update)
                    $('#saveAccountBtn').on('click', function () {
                        const form = document.getElementById('accountForm');
                        if (!form.checkValidity()) {
                            form.reportValidity();
                            return;
                        }

                        const accountData = {
                            accountName: $('#accountName').val(),
                            accountType: $('#accountType').val()
                        };

                        if (mode === 'CREATE') {
                            accountData.initialBalance = parseFloat($('#initialBalance').val()) || 0.0;
                            accountData.currentBalance = accountData.initialBalance;
                            accountData.currency = $('#currency').val();
                        }

                        const url = mode === 'CREATE' ? '/api/accounts' : '/api/accounts/' + $('#accountId').val();
                        const type = mode === 'CREATE' ? 'POST' : 'PUT';

                        const $saveBtn = $(this);
                        $saveBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Đang lưu...');

                        $.ajax({
                            url: url,
                            type: type,
                            contentType: 'application/json',
                            data: JSON.stringify(accountData),
                            success: function (response) {
                                accountModal.hide();
                                location.reload();
                            },
                            error: function (xhr) {
                                $saveBtn.prop('disabled', false).text('Lưu');
                                let errorMsg = 'Có lỗi xảy ra, vui lòng thử lại.';
                                if (xhr.status === 400 || xhr.status === 500) {
                                    try {
                                        const errObj = typeof xhr.responseJSON === 'object' ? xhr.responseJSON : JSON.parse(xhr.responseText);
                                        if (errObj) {
                                            if (errObj.error && typeof errObj.error === 'object' && !Array.isArray(errObj.error)) {
                                                errorMsg = Object.values(errObj.error).join(', ');
                                            } else if (errObj.error && Array.isArray(errObj.error) && errObj.error.length > 0) {
                                                errorMsg = errObj.error.map(function (err) { return err.defaultMessage; }).join(', ');
                                            } else if (errObj.errors && Array.isArray(errObj.errors) && errObj.errors.length > 0) {
                                                errorMsg = errObj.errors.map(function (err) { return err.defaultMessage; }).join(', ');
                                            } else if (errObj.message) {
                                                errorMsg = errObj.message;
                                            }
                                        }
                                    } catch (e) {
                                        if (xhr.responseText) {
                                            errorMsg = xhr.responseText;
                                        }
                                    }
                                } else {
                                    errorMsg = "Lỗi kết nối máy chủ. Vui lòng thử lại sau!";
                                }
                                showError(errorMsg);
                            }
                        });
                    });

                    // Open Delete Confirmation
                    $(document).on('click', '.delete-account-btn', function () {
                        accountIdToDelete = $(this).data('id');
                        const name = $(this).data('name');
                        $('#deleteAccountName').text(name);
                        deleteConfirmModal.show();
                    });

                    // Confirm Delete
                    $('#confirmDeleteBtn').on('click', function () {
                        if (!accountIdToDelete) return;

                        const $deleteBtn = $(this);
                        $deleteBtn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Đang xóa...');

                        $.ajax({
                            url: '/api/accounts/' + accountIdToDelete,
                            type: 'DELETE',
                            success: function (response) {
                                deleteConfirmModal.hide();
                                location.reload();
                            },
                            error: function (xhr) {
                                $deleteBtn.prop('disabled', false).text('Xóa');
                                let errorMsg = 'Có lỗi xảy ra, vui lòng thử lại.';
                                if (xhr.status === 400 || xhr.status === 500) {
                                    try {
                                        const errObj = typeof xhr.responseJSON === 'object' ? xhr.responseJSON : JSON.parse(xhr.responseText);
                                        if (errObj) {
                                            if (errObj.error && typeof errObj.error === 'object' && !Array.isArray(errObj.error)) {
                                                errorMsg = Object.values(errObj.error).join(', ');
                                            } else if (errObj.error && Array.isArray(errObj.error) && errObj.error.length > 0) {
                                                errorMsg = errObj.error.map(function (err) { return err.defaultMessage; }).join(', ');
                                            } else if (errObj.errors && Array.isArray(errObj.errors) && errObj.errors.length > 0) {
                                                errorMsg = errObj.errors.map(function (err) { return err.defaultMessage; }).join(', ');
                                            } else if (errObj.message) {
                                                errorMsg = errObj.message;
                                            }
                                        }
                                    } catch (e) {
                                        if (xhr.responseText) {
                                            errorMsg = xhr.responseText;
                                        }
                                    }
                                } else {
                                    errorMsg = "Lỗi kết nối máy chủ. Vui lòng thử lại sau!";
                                }
                                alert(errorMsg);
                            }
                        });
                    });
                });
            });
        </script>
    </div>
    <!-- ================= END CONTENT ================= -->

    <!-- JS -->
    <script th:src="@{/lib/jQuery/jquery-3.5.1.min.js}"></script>
    <script th:src="@{/lib/bootstrap_5/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/assets/js/main.js}"></script>

</body>

</html>
